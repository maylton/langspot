[package]
name = "langspot"
version = "1.6.2"
description = "Dashboard para professores independentes de idiomas"
authors = ["Maylton Fernandes"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "langspot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

# Same WebKitGTK bindings as wry: used to enable microphone recording on Linux (src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
