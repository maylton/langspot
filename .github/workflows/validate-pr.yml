name: Validate Pull Request

on:
  pull_request:
  push:
    branches:
      - "feature/cefr-a2-b1-placement-check"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Validate CEFR pilot bank
        run: npm run test:cefr:pilot

      - name: Validate CEFR presets
        run: npm run test:cefr:presets

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Assessment database smoke tests
        run: npm run test:assessments:db

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
